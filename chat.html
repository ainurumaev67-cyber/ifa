<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFA Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f9f9fb;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .chat-header {
            background: #6C63FF;
            color: #fff;
            padding: 14px 18px;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .chat-header .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 6px #4ade80;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg {
            max-width: 82%;
            padding: 11px 15px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: msg-in 0.25s ease;
        }
        @keyframes msg-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg.user {
            align-self: flex-end;
            background: #6C63FF;
            color: #fff;
            border-bottom-right-radius: 6px;
        }
        .msg.bot {
            align-self: flex-start;
            background: #fff;
            color: #1d1d1f;
            border: 1px solid #e5e5e7;
            border-bottom-left-radius: 6px;
        }
        .msg.bot.typing {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 11px 15px;
        }
        .typing-dots { display: flex; gap: 3px; align-items: center; }
        .typing-dots span {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #999;
            animation: dot-jump 1.2s infinite;
        }
        .typing-dots span:nth-child(1) { animation-delay: 0s; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dot-jump {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
        }
        .input-area {
            display: flex;
            padding: 12px 14px;
            border-top: 1px solid #e5e5e7;
            background: #fff;
            gap: 8px;
            flex-shrink: 0;
        }
        .input-area input {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid #e5e5e7;
            border-radius: 22px;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: border 0.2s;
        }
        .input-area input:focus { border-color: #6C63FF; }
        .input-area button {
            background: #6C63FF;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 22px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }
        .input-area button:hover { background: #5a52d5; }
        .input-area button:disabled { background: #c0c0d0; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="chat-header">
        <div class="dot"></div>
        IFA Assistant
    </div>
    <div class="messages" id="messages">
        <div class="msg bot">👋 Привет! Я IFA Assistant. Чем могу помочь?</div>
    </div>
    <div class="input-area">
        <input type="text" id="input" placeholder="Напиши вопрос...">
        <button id="send">Отправить</button>
    </div>
    <script>
        const messagesDiv = document.getElementById('messages');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');

        const STORAGE_KEY = 'ifa_chat_history';
        const API_URL = 'https://ifa.ainurumaev67.workers.dev/api';

        // Контекст из URL
        const urlParams = new URLSearchParams(window.location.search);
        const siteData = urlParams.get('data');
        const siteDesc = urlParams.get('desc');
        let contextPrompt = '';
        if (siteData) {
            try {
                const data = JSON.parse(decodeURIComponent(siteData));
                contextPrompt = `Контекст: ${siteDesc || ''}. Данные: ${JSON.stringify(data)}. `;
            } catch(e) {}
        }

        function loadHistory() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                JSON.parse(saved).forEach(m => addMessage(m.text, m.role));
            }
        }

        function saveMessage(text, role) {
            const saved = localStorage.getItem(STORAGE_KEY);
            const history = saved ? JSON.parse(saved) : [];
            history.push({ text, role });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
        }

        function addMessage(text, role) {
            const msg = document.createElement('div');
            msg.className = 'msg ' + role;
            msg.textContent = text;
            messagesDiv.appendChild(msg);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function askAI(question) {
            addMessage(question, 'user');
            saveMessage(question, 'user');
            input.value = '';
            sendBtn.disabled = true;
            input.disabled = true;

            const typing = document.createElement('div');
            typing.className = 'msg bot typing';
            typing.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
            messagesDiv.appendChild(typing);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            try {
                const fullPrompt = contextPrompt + question;
                const resp = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: fullPrompt })
                });
                const data = await resp.json();
                typing.remove();
                addMessage(data.reply, 'bot');
                saveMessage(data.reply, 'bot');
            } catch(e) {
                typing.remove();
                addMessage('Ошибка соединения.', 'bot');
            }

            sendBtn.disabled = false;
            input.disabled = false;
            input.focus();
        }

        sendBtn.addEventListener('click', () => {
            const q = input.value.trim();
            if (q) askAI(q);
        });

        input.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                const q = input.value.trim();
                if (q) askAI(q);
            }
        });

        loadHistory();
    </script>
</body>
</html>
